# Workflow to run the package unit tests on multiple python versions (CI)

name: Oasislmf Testing

on:
  pull_request:
  push:
    branches:
      - main
      - stable**
  workflow_dispatch:
    inputs:
      ods_branch:
        description: "Git install ods_tools branch before tests: [git ref]"
        required: false

jobs:
  ods_tools:
    if: ${{ inputs.ods_branch != '' || github.event_name != 'workflow_dispatch' }}
    uses: OasisLMF/ODS_Tools/.github/workflows/build.yml@main
    secrets: inherit
    with:
      ods_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' ||  inputs.ods_branch }} # Enable 'ods-tools' build by default

  unittest:
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    needs: [ods_tools]
    strategy:
      matrix:
        cfg:
          - { python-version: "3.10", pkg-version: "", upload-cov: false }
          - { python-version: "3.11", pkg-version: "", upload-cov: false }
          - { python-version: "3.12", pkg-version: "", upload-cov: true }
          - { python-version: "3.13", pkg-version: "", upload-cov: false }
          - { python-version: "3.14", pkg-version: "", upload-cov: false }

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.cfg.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.cfg.python-version }}

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade uv

      - name: Pip Compile
        run: |
          rm -f requirements.txt
          if [ -z "${{ matrix.cfg.pkg-version }}" ]; then
            uv pip compile requirements.in --output-file requirements.txt
          else
            uv pip compile --upgrade-package "${{ matrix.cfg.pkg-version }}" requirements.in > requirements.txt
          fi
          uv pip install --system -r requirements.txt

      - name: Install oasislmf
        run: pip install -e .

      - name: download ods_tools
        if: needs.ods_tools.outputs.whl_filename != ''
        uses: actions/download-artifact@v4
        with:
          name: bin_package
          path: ${{ github.workspace }}/

      - name: install ods_tools
        if: needs.ods_tools.outputs.whl_filename != ''
        run: |
          pip uninstall ods_tools -y
          pip install ${{ needs.ods_tools.outputs.whl_filename }}

      # NUMBA_BOUNDSCHECK must be set here as well as on the test run. numba's on-disk cache key
      # does not include the flag, so a cache warmed without it is reused by a checked run and the
      # checks silently never happen -- for exactly the hot functions warmup covers.
      - name: Warmup Numba JIT cache
        if: matrix.cfg.upload-cov != true
        run: oasislmf warmup
        env:
          NUMBA_BOUNDSCHECK: 1

      # The package's docstring examples are not reachable from the main run: testpaths is tests,
      # and --doctest-modules cannot be enabled globally because it would import test helper
      # scripts that are only importable with their own directory on sys.path. Run them here so
      # they cannot rot -- one had never passed before this step existed.
      - name: run doctests (oasislmf package)
        run: pytest -p no:flaky --doctest-modules --no-cov oasislmf/

      # Bounds-check the JIT-enabled runs: numba does not bounds-check by default, so indexing a
      # numba array out of range is a silent wrong answer or a corrupt write rather than an
      # IndexError. Costs about 2% of the run.
      - name: run pytest (JIT enabled)
        if: matrix.cfg.upload-cov != true
        run: pytest -p no:flaky --ignore=fm_testing_tool --ignore=validation --cov-config=tox.ini --cov=oasislmf --cov-report=xml --cov-report=term
        env:
          NUMBA_BOUNDSCHECK: 1

      - name: run pytest (JIT disabled)
        if: matrix.cfg.upload-cov == true
        run: pytest -p no:flaky --ignore=fm_testing_tool --ignore=validation --cov-config=tox.ini --cov=oasislmf --cov-report=xml --cov-report=term --gul-rtol 1e-3 --gul-atol 1e-3
        env:
          NUMBA_DISABLE_JIT: 1

      - name: Upload coverage to Codecov
        if: matrix.cfg.upload-cov == true
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
