name: Build Docs
on:
  pull_request:
    # build docs for all PRs targeting main
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    concurrency: ci-${{ github.ref }}   # one docs build per branch at a time
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Compile package requirements.txt
        run: |
             python -m pip install --upgrade "pip<23.3"
             pip install uv
             uv pip compile requirements.in --output-file requirements.txt
      - name: Install required packages
        run: |
            uv pip install --system -r requirements.txt
            uv pip install --system .
            uv pip install --system furo
      - name: Build
        run: ./docs/build.sh
      - name: Upload the built docs (for review; nothing is deployed from here)
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: './docs/build/html/'
