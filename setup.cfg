[wheel]
universal = 0

[options]
editable_mode = compat

[metadata]
description_file = README.md

[tool:pytest]
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,.ropeproject
python_classes =
testpaths = tests
markers =
    jit_compile: marks tests that trigger JIT compilation of Numba functions
    requires_bash: runs bash kernel scripts or pytools pipelines over OS pipes; skipped on Windows and with OASIS_TEST_NO_BASH set

[coverage:run]
branch = true

[coverage:report]
show_missing = true
